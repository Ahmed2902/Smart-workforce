services:
  auth-service:
    build: F:\Projects\Smart_Workforce\smart-workforce\services\auth-service
    ports:
      - '3001:3001'
    env_file:
      - ./services/auth-service/.env

    depends_on:
      - postgres
      - redis
      - nats
    environment:
      DATABASE_URL: postgres://swma:swma@postgres:5432/swma
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
    restart: unless-stopped
    command: npm run start
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: swma
      POSTGRES_PASSWORD: swma
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'

  nats:
    image: nats:2
    restart: unless-stopped
    ports:
      - '4222:4222'
      - '8222:8222' # monitoring

volumes:
  pgdata:
