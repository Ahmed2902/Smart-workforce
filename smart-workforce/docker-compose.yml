services:
  auth-service:
    build: F:\Projects\Smart_Workforce\smart-workforce\services\auth-service
    ports:
      - '3001:3001'
    env_file:
      - ./services/auth-service/.env

    depends_on:
      - postgres
      - redis
      - rabbitmq
    environment:
      DATABASE_URL: postgres://swma:swma@postgres:5432/swma
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
    restart: unless-stopped
    command: npm run start
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: swma
      POSTGRES_PASSWORD: swma
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      - '15672:15672'

volumes:
  pgdata:
