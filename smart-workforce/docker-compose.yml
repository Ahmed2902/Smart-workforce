services:
  api-gateway:
    image: nginx:1.27-alpine
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
      attendance-service:
        condition: service_healthy
      payroll-service:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-gateway-internal-token}
      AUTH_LIMIT_RATE: ${AUTH_LIMIT_RATE:-1000r/m}
      API_LIMIT_RATE: ${API_LIMIT_RATE:-1000r/m}
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:8080/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '15672:15672'
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  auth-db:
    image: postgres:16
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: authdb
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auth -d authdb']
      interval: 10s
      timeout: 5s
      retries: 10

  user-db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: userdb
    volumes:
      - user_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d userdb']
      interval: 10s
      timeout: 5s
      retries: 10

  schedule-db:
    image: postgres:16
    environment:
      POSTGRES_USER: schedule
      POSTGRES_PASSWORD: schedule
      POSTGRES_DB: scheduledb
    volumes:
      - schedule_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U schedule -d scheduledb']
      interval: 10s
      timeout: 5s
      retries: 10

  attendance-db:
    image: postgres:16
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendancedb
    volumes:
      - attendance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U attendance -d attendancedb']
      interval: 10s
      timeout: 5s
      retries: 10

  payroll-db:
    image: postgres:16
    environment:
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll
      POSTGRES_DB: payrolldb
    volumes:
      - payroll_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payroll -d payrolldb']
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgres://auth:auth@auth-db:5432/authdb
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-gateway-internal-token}
      AUTH_GLOBAL_RATE_LIMIT_MAX: ${AUTH_GLOBAL_RATE_LIMIT_MAX:-10000}
      AUTH_GLOBAL_RATE_LIMIT_WINDOW_MS: ${AUTH_GLOBAL_RATE_LIMIT_WINDOW_MS:-60000}
      AUTH_LOGIN_RATE_LIMIT_MAX: ${AUTH_LOGIN_RATE_LIMIT_MAX:-1000}
      AUTH_LOGIN_RATE_LIMIT_WINDOW_MS: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_MS:-60000}
    command: sh -c "npm run prisma:deploy && npm run start"
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    depends_on:
      user-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgres://user:user@user-db:5432/userdb
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-gateway-internal-token}
      BOOTSTRAP_SUPERADMIN_EMAIL: ${BOOTSTRAP_SUPERADMIN_EMAIL:-admin@example.com}
    command: sh -c "npm run prisma:deploy && npm run start"
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3002/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  schedule-service:
    build:
      context: .
      dockerfile: services/schedule-service/Dockerfile
    depends_on:
      schedule-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: postgres://schedule:schedule@schedule-db:5432/scheduledb
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-gateway-internal-token}
    command: sh -c "npm run prisma:deploy && npm run start"
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3003/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  attendance-service:
    build:
      context: .
      dockerfile: services/attendance-service/Dockerfile
    depends_on:
      attendance-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3004
      DATABASE_URL: postgres://attendance:attendance@attendance-db:5432/attendancedb
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      SCHEDULE_SERVICE_URL: http://schedule-service:3003
      JWT_SECRET: ${JWT_SECRET:-change-me}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-gateway-internal-token}
    command: sh -c "npm run prisma:deploy && npm run start"
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3004/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  payroll-service:
    build:
      context: .
      dockerfile: services/payroll-service/Dockerfile
    depends_on:
      payroll-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      attendance-service:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3005
      DATABASE_URL: postgres://payroll:payroll@payroll-db:5432/payrolldb
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      ATTENDANCE_SERVICE_URL: http://attendance-service:3004/api/attendance
      ATTENDANCE_SERVICE_INTERNAL_URL: http://attendance-service:3004/internal/attendance
      JWT_SECRET: ${JWT_SECRET:-change-me}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-gateway-internal-token}
    command: sh -c "npm run prisma:deploy && npm run start"
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3005/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  auth_pgdata:
  user_pgdata:
  schedule_pgdata:
  attendance_pgdata:
  payroll_pgdata:
