worker_processes auto;

events {
  worker_connections 1024;
}

http {
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

  upstream auth_service {
    server auth-service:3001;
  }

  upstream user_service {
    server user-service:3002;
  }

  upstream schedule_service {
    server schedule-service:3003;
  }

  upstream attendance_service {
    server attendance-service:3004;
  }

  upstream payroll_service {
    server payroll-service:3005;
  }

  server {
    listen 8080;
    server_name _;

    client_max_body_size 10m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_http_version 1.1;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-Id" always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;

    if ($request_method = OPTIONS) {
      return 204;
    }

    location = /health {
      add_header Content-Type text/plain;
      return 200 "ok";
    }

    location = /_auth {
      internal;
      proxy_pass http://auth_service/internal/auth/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Gateway-Token gateway-internal-token;
      proxy_set_header X-Request-Id $request_id;
    }

    location ~ ^/api/auth/(login|register|refresh|forgot-password|reset-password)$ {
      limit_req zone=auth_limit burst=20 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_pass http://auth_service;
    }

    location /api/auth {
      auth_request /_auth;
      auth_request_set $auth_user_id $upstream_http_x_user_id;
      auth_request_set $auth_user_email $upstream_http_x_user_email;
      auth_request_set $auth_user_role $upstream_http_x_user_role;
      auth_request_set $auth_sub $upstream_http_x_auth_sub;

      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-User-Id $auth_user_id;
      proxy_set_header X-User-Email $auth_user_email;
      proxy_set_header X-User-Role $auth_user_role;
      proxy_set_header X-Auth-Sub $auth_sub;
      proxy_set_header X-Gateway-Token gateway-internal-token;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_pass http://auth_service;
    }

    location /api/users {
      auth_request /_auth;
      auth_request_set $auth_user_id $upstream_http_x_user_id;
      auth_request_set $auth_user_email $upstream_http_x_user_email;
      auth_request_set $auth_user_role $upstream_http_x_user_role;
      auth_request_set $auth_sub $upstream_http_x_auth_sub;

      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-User-Id $auth_user_id;
      proxy_set_header X-User-Email $auth_user_email;
      proxy_set_header X-User-Role $auth_user_role;
      proxy_set_header X-Auth-Sub $auth_sub;
      proxy_set_header X-Gateway-Token gateway-internal-token;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_pass http://user_service;
    }

    location /api/departments {
      auth_request /_auth;
      auth_request_set $auth_user_id $upstream_http_x_user_id;
      auth_request_set $auth_user_email $upstream_http_x_user_email;
      auth_request_set $auth_user_role $upstream_http_x_user_role;
      auth_request_set $auth_sub $upstream_http_x_auth_sub;

      proxy_set_header Host $host;
