# Nginx gateway template rendered via envsubst at container startup.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=$AUTH_LIMIT_RATE;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=$API_LIMIT_RATE;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

map $http_x_request_id $req_id {
  default $request_id;
  "~^[A-Za-z0-9._:-]{8,128}$" $http_x_request_id;
}

upstream auth_service {
  server auth-service:3001;
}

upstream user_service {
  server user-service:3002;
}

upstream schedule_service {
  server schedule-service:3003;
}

upstream attendance_service {
  server attendance-service:3004;
}

upstream payroll_service {
  server payroll-service:3005;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  client_max_body_size 10m;
  client_body_timeout 15s;
  keepalive_timeout 30s;
  send_timeout 30s;

  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;
  proxy_http_version 1.1;
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 2;

  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-Id" always;
  add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
  add_header X-Request-Id $req_id always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  if ($request_method = OPTIONS) {
    return 204;
  }

  location = /health {
    allow 127.0.0.1;
    deny all;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  location = /_auth {
    internal;
    proxy_pass http://auth_service/internal/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Gateway-Token "${GATEWAY_TOKEN}";
    proxy_set_header X-Request-Id $req_id;
  }

  location @auth_401 {
    return 401;
  }

  location @auth_403 {
    return 403;
  }

  location ~ ^/api/auth/(login|register|refresh|forgot-password|reset-password)$ {
    limit_req zone=auth_limit burst=20 nodelay;
    limit_req zone=api_limit burst=60 nodelay;
    limit_conn conn_limit 50;
    client_max_body_size 1m;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $req_id;
    proxy_pass http://auth_service;
  }

  location /api/auth {
    auth_request /_auth;
    error_page 401 = @auth_401;
    error_page 403 = @auth_403;
    auth_request_set $auth_user_id $upstream_http_x_user_id;
    auth_request_set $auth_user_email $upstream_http_x_user_email;
    auth_request_set $auth_user_role $upstream_http_x_user_role;
    auth_request_set $auth_sub $upstream_http_x_auth_sub;

    limit_req zone=api_limit burst=60 nodelay;
    client_max_body_size 1m;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-User-Id $auth_user_id;
    proxy_set_header X-User-Email $auth_user_email;
    proxy_set_header X-User-Role $auth_user_role;
    proxy_set_header X-Auth-Sub $auth_sub;
    proxy_set_header X-Gateway-Token "${GATEWAY_TOKEN}";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $req_id;
    proxy_pass http://auth_service;
  }

  location /api/users {
