version: "3.9"
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: swma
      POSTGRES_PASSWORD: swma
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  nats:
    image: nats:2
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222" # monitoring

volumes:
  pgdata:
