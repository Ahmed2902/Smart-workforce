services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: swma
      POSTGRES_PASSWORD: swma
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      - '15672:15672'

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - '3001:3001'
    env_file:
      - ./services/auth-service/.env
    depends_on:
      - postgres
      - rabbitmq
    environment:
      DATABASE_URL: postgres://swma:swma@postgres:5432/swma
      RABBITMQ_URL: amqp://rabbitmq:5672
    command: npm run start

  user-service:
    build:
      context: .
      dockerfile: ./services/user-service/Dockerfile
    ports:
      - '3002:4000'
    env_file:
      - ./services/user-service/.env
    depends_on:
      - postgres
      - rabbitmq
    environment:
      DATABASE_URL: postgres://swma:swma@postgres:5432/user_service_db
      RABBITMQ_URL: amqp://rabbitmq:5672
    working_dir: /app/services/user-service

  schedule-service:
    build:
      context: .
      dockerfile: services/schedule-service/Dockerfile
    ports:
      - '3003:3003'
    env_file:
      - ./services/schedule-service/.env
    depends_on:
      - postgres
      - rabbitmq
    environment:
      DATABASE_URL: postgres://swma:swma@postgres:5432/swma
      RABBITMQ_URL: amqp://rabbitmq:5672
    command: npm run start

volumes:
  pgdata:
